# The Python environment of Abhyasa.app: the released abhyasa, pinned. The app runs `uv sync --frozen` on this
# project. To change the version, edit the pin, then run `make lock`.
[project]
name = "abhyasa-app"
version = "0.0.5"
requires-python = ">=3.12,<3.13"
dependencies = ["abhyasa[whisper,tick,models]==0.0.9"]

[tool.uv]
package = false
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "abhyasa"
dynamic = ["version"]
description = "A tutor that asks you questions: active recall, a learner model and a concept graph in your vault"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Karthik", email = "karthik.rajgopal@hotmail.com"}]
keywords = ['nbdev', 'learning', 'spaced-repetition', 'active-recall', 'vishalakshi']
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "fastcore>=1.8",
    "vishalakshi>=0.1.35",
    "rishi>=0.1.56",
    "python-fasthtml>=0.14",
    "ipywidgets>=8.1",
    "rupaka>=0.0.6",
    "vidyut>=0.4",
    "mdhtml>=0.1.38",
    "nh3>=0.3.7",
    "fossick>=0.1.22",
]

[project.optional-dependencies]
whisper = ["mlx-audio>=0.5"]
tick = ["pobblebonk>=0.0.6"]
demo = ["rupaka[check]>=0.0.6"]
dev = ["ipykernel>=7.3.0", "nbdev>=3.3.25", "notebook>=7.6.3", "pytest>=8", "pobblebonk>=0.0.6", "rupaka[check]>=0.0.6"]
models = [
    "ramabana>=0.2.78",
]

[project.scripts]
abhyasa = "abhyasa.app:main"
abhyasa-index = "abhyasa.ground:index_main"

[project.urls]
Repository = "https://github.com/vedicreader/abhyasa"
Documentation = "https://vedicreader.github.io/abhyasa/"

[project.entry-points."ramabana.ticks"]
abhyasa-index = "abhyasa.ground:tick"

[project.entry-points.nbdev]
abhyasa = "abhyasa._modidx:d"

[tool.nbdev]
tst_flags = "slow"

[tool.hatch.build.targets.wheel]
packages = ["abhyasa"]

[tool.hatch.build.targets.sdist]
include = ["/abhyasa", "/README.md", "/pyproject.toml"]

[tool.hatch.version]
path = "abhyasa/__init__.py"


[dependency-groups]
dev = ["abhyasa[dev]"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "abhyasa"
dynamic = ["version"]
description = "A tutor that asks you questions: active recall, a learner model and a concept graph in your vault"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Karthik", email = "karthik.rajgopal@hotmail.com"}]
keywords = ['nbdev', 'learning', 'spaced-repetition', 'active-recall', 'vishalakshi']
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "fastcore>=2.2.41",
    "vishalakshi>=0.1.38",
    "litesearch>=0.1.64",   # `fold_text` and the notebook outputs in `ipynb_parse`
    "rishi[claude]>=0.1.70",   # the default claude/sonnet model; 0.1.70 moved the Claude SDK into the claude extra
    "python-fasthtml>=0.14.22",
    "ipywidgets>=8.1.9",
    "rupaka>=0.0.17",
    "vidyut>=0.4",
    "mdhtml>=0.1.45",
    "nh3>=0.3.7",
    "fossick>=0.1.28",
    "ramabana>=0.2.115",   # 0.2.115 needs rishi[claude]; model routing, the guard (`ramabana.guard`), `Agent.oneshot_stream`, `model_label` and `read_key`
    "shalya>=0.1.33",   # `LocalHost(url_ok=, on_read=)` and `read_page`
    "gheasy>=0.0.21",   # `gh_repo_info`
]

[project.optional-dependencies]
whisper = ["mlx-audio>=0.6.5"]   # speech to text on this Mac: Qwen3-ASR, Whisper and the other mlx-community models
tick = []   # empty: abhyasa no longer indexes on a ramabana tick; the extra stays so that old pins still resolve
demo = ["rupaka[check]>=0.0.17"]
dev = ["ipykernel>=7.3.0", "nbdev>=3.3.28", "notebook>=7.6.5", "pytest>=9.2", "rupaka[check]>=0.0.17"]
models = ["ramabana>=0.2.115"]   # now a core dependency; the extra stays so that old installs still resolve
voice = ["mlx-audio>=0.6.5", "pocket-tts-mlx>=0.3"]   # the voice on this Mac: Pocket TTS (MIT code, CC-BY-4.0 weights by Kyutai)

[project.scripts]
abhyasa = "abhyasa.app:main"

[project.urls]
Repository = "https://github.com/vedicreader/abhyasa"
Documentation = "https://vedicreader.github.io/abhyasa/"

[project.entry-points.nbdev]
abhyasa = "abhyasa._modidx:d"

[tool.nbdev]
tst_flags = "slow"

[tool.hatch.build.targets.wheel]
packages = ["abhyasa"]

[tool.hatch.build.targets.sdist]
include = ["/abhyasa", "/README.md", "/pyproject.toml"]

[tool.hatch.version]
path = "abhyasa/__init__.py"


[dependency-groups]
dev = ["abhyasa[dev]"]

[tool.pytest.ini_options]
testpaths = ["tests"]
